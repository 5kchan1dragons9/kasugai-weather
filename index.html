<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>春日井市 Weather Station</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f3f5f7;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;
    }


    /* =========================
       上部タブ
       ========================= */

    .tabs {

      display: flex;

      width: 100%;
      height: 54px;

      background: white;

      border-bottom:
        1px solid #ddd;

      box-shadow:
        0 2px 6px
        rgba(0,0,0,0.08);

      position: relative;

      z-index: 20;

    }


    .tab {

      flex: 1;

      border: none;

      background: white;

      color: #777;

      font-size: 16px;

      font-weight: 600;

      cursor: pointer;

      -webkit-tap-highlight-color:
        transparent;

    }


    .tab.active {

      color: #222;

      background: #f3f5f7;

      box-shadow:
        inset 0 -3px 0 #222;

    }


    /* =========================
       スライド領域
       ========================= */

    .slider {

      position: relative;

      width: 100%;

      height:
        calc(100vh - 54px);

      overflow: hidden;

      touch-action: pan-y;

    }


    .pages {

      display: flex;

      width: 200%;

      height: 100%;

      transition:
        transform 0.28s
        ease-out;

      will-change:
        transform;

    }


    .page {

      display: block;

      flex: 0 0 50%;

      width: 50%;

      height: 100%;

      border: none;

    }


    /* 屋外 */

    .pages.outdoor {

      transform:
        translateX(0);

    }


    /* 屋内 */

    .pages.indoor {

      transform:
        translateX(-50%);

    }


  </style>

</head>


<body>


  <!-- =========================
       タブ
       ========================= -->

  <div class="tabs">

    <button
      class="tab active"
      id="outdoorTab"
      onclick="showPage('outdoor')"
    >
      🌤️ 屋外
    </button>


    <button
      class="tab"
      id="indoorTab"
      onclick="showPage('indoor')"
    >
      🏠 屋内
    </button>

  </div>



  <!-- =========================
       スライド領域
       ========================= -->

  <div
    class="slider"
    id="slider"
  >

    <div
      class="pages outdoor"
      id="pages"
    >

      <iframe
        id="outdoorPage"
        class="page"
        src="outdoor.html"
      ></iframe>


      <iframe
        id="indoorPage"
        class="page"
        src="indoor.html"
      ></iframe>

    </div>

  </div>



  <script>


    /* =========================
       現在のページ
       ========================= */

    let currentPage =
      "outdoor";


    const pages =
      document.getElementById(
        "pages"
      );


    const outdoorTab =
      document.getElementById(
        "outdoorTab"
      );


    const indoorTab =
      document.getElementById(
        "indoorTab"
      );


    /* =========================
       ページ切り替え
       ========================= */

    function showPage(page) {

      currentPage =
        page;


      if (
        page === "outdoor"
      ) {

        pages.classList.remove(
          "indoor"
        );

        pages.classList.add(
          "outdoor"
        );


        outdoorTab.classList.add(
          "active"
        );

        indoorTab.classList.remove(
          "active"
        );

      }


      else if (
        page === "indoor"
      ) {

        pages.classList.remove(
          "outdoor"
        );

        pages.classList.add(
          "indoor"
        );


        indoorTab.classList.add(
          "active"
        );

        outdoorTab.classList.remove(
          "active"
        );

      }

    }



    /* =========================
       スワイプ処理
       ========================= */

    let startX = 0;

    let startY = 0;

    let startTime = 0;


    const slider =
      document.getElementById(
        "slider"
      );


    slider.addEventListener(
      "touchstart",
      function(event) {

        const touch =
          event.touches[0];


        startX =
          touch.clientX;

        startY =
          touch.clientY;

        startTime =
          Date.now();

      },
      {
        passive: true
      }
    );


    slider.addEventListener(
      "touchend",
      function(event) {

        const touch =
          event.changedTouches[0];


        const endX =
          touch.clientX;

        const endY =
          touch.clientY;


        const diffX =
          endX - startX;


        const diffY =
          endY - startY;


        const elapsed =
          Date.now() -
          startTime;


        /*
         * 縦スクロールを
         * 横スワイプと誤認しない
         */

        if (
          Math.abs(diffX) <
          Math.abs(diffY)
        ) {

          return;

        }


        /*
         * 小さすぎる移動は無視
         */

        if (
          Math.abs(diffX) < 50
        ) {

          return;

        }


        /*
         * 長すぎる操作は無視
         */

        if (
          elapsed > 800
        ) {

          return;

        }


        /*
         * 左へスワイプ
         *
         * 屋外 → 屋内
         */

        if (
          diffX < -50 &&
          currentPage ===
            "outdoor"
        ) {

          showPage(
            "indoor"
          );

        }


        /*
         * 右へスワイプ
         *
         * 屋内 → 屋外
         */

        else if (
          diffX > 50 &&
          currentPage ===
            "indoor"
        ) {

          showPage(
            "outdoor"
          );

        }

      },
      {
        passive: true
      }
    );


  </script>


</body>

</html>
