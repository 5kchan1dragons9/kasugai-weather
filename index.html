<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>春日井市 Weather Station</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f3f5f7;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;
    }

    /* ================================
       上部タブ
       ================================ */

    .tabs {
      display: flex;
      width: 100%;
      height: 54px;
      background: white;
      border-bottom: 1px solid #ddd;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      position: relative;
      z-index: 10;
    }


    .tab {
      flex: 1;
      border: none;
      background: white;
      color: #777;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;

      -webkit-tap-highlight-color: transparent;
    }


    .tab.active {
      color: #222;
      background: #f3f5f7;
      box-shadow: inset 0 -3px 0 #222;
    }


    /* ================================
       ページ
       ================================ */

    .pages {
      position: relative;
      width: 100%;
      height: calc(100vh - 54px);
      overflow: hidden;
    }


    .page {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      background: #f3f5f7;
    }


    .page.active {
      display: block;
    }

  </style>

</head>


<body class="outdoor">


  <!-- ================================
       タブ
       ================================ -->

  <div class="tabs">

    <button
      class="tab active"
      id="outdoorTab"
      type="button"
    >
      🌤️ 屋外
    </button>


    <button
      class="tab"
      id="indoorTab"
      type="button"
    >
      🏠 屋内
    </button>

    <button
  class="tab"
  id="warningTab"
  type="button"
>
  ⚠️ 注警報
</button>
    
  </div>



  <!-- ================================
       ページ
       ================================ -->

  <div class="pages">

    <iframe
      id="outdoorPage"
      class="page active"
      src="outdoor.html"
      title="屋外"
    ></iframe>


    <iframe
      id="indoorPage"
      class="page"
      src="indoor.html"
      title="屋内"
    ></iframe>

<iframe
  id="warningPage"
  class="page"
  src="warning.html"
  title="注警報"
></iframe>

  </div>



  <script>


    /* ================================
       現在表示しているページ
       ================================ */

    let currentPage = "outdoor";



    /* ================================
       ページ切り替え
       ================================ */

    function showPage(page) {

  const outdoorPage =
    document.getElementById(
      "outdoorPage"
    );

  const indoorPage =
    document.getElementById(
      "indoorPage"
    );

  const warningPage =
    document.getElementById(
      "warningPage"
    );

  const outdoorTab =
    document.getElementById(
      "outdoorTab"
    );

  const indoorTab =
    document.getElementById(
      "indoorTab"
    );

  const warningTab =
    document.getElementById(
      "warningTab"
    );


  /* いったん全部非表示 */

  outdoorPage.classList.remove("active");
  indoorPage.classList.remove("active");
  warningPage.classList.remove("active");

  outdoorTab.classList.remove("active");
  indoorTab.classList.remove("active");
  warningTab.classList.remove("active");


  /* 選択されたページだけ表示 */

  if (page === "outdoor") {

    outdoorPage.classList.add("active");
    outdoorTab.classList.add("active");

    currentPage = "outdoor";

  }


  if (page === "indoor") {

    indoorPage.classList.add("active");
    indoorTab.classList.add("active");

    currentPage = "indoor";

  }


  if (page === "warning") {

    warningPage.classList.add("active");
    warningTab.classList.add("active");

    currentPage = "warning";

  }

}


    /* ================================
       タブ
       ================================ */

    document
      .getElementById("outdoorTab")
      .addEventListener(
        "click",
        function() {

          showPage("outdoor");

        }
      );


    document
      .getElementById("indoorTab")
      .addEventListener(
        "click",
        function() {

          showPage("indoor");

        }
      );

document
  .getElementById("warningTab")
  .addEventListener(
    "click",
    function() {

      showPage("warning");

    }
  );

    /* ================================
       iframe内部へのスワイプ検知
       
       outdoor.html / indoor.html
       は変更しない。
       
       index.htmlからiframe内部の
       documentにイベントを設定する。
       ================================ */

    function setupSwipe(
      iframe,
      pageName
    ) {


      try {

        const iframeDocument =
          iframe.contentDocument ||
          iframe.contentWindow.document;


        if (!iframeDocument) {

          return;

        }


        let startX = 0;
        let startY = 0;
        let startTime = 0;



        iframeDocument.addEventListener(
          "touchstart",
          function(event) {


            if (
              !event.touches ||
              event.touches.length === 0
            ) {

              return;

            }


            const touch =
              event.touches[0];


            startX =
              touch.clientX;


            startY =
              touch.clientY;


            startTime =
              Date.now();

          },
          {
            passive: true
          }
        );



        iframeDocument.addEventListener(
          "touchend",
          function(event) {


            if (
              !event.changedTouches ||
              event.changedTouches.length === 0
            ) {

              return;

            }


            const touch =
              event.changedTouches[0];


            const endX =
              touch.clientX;


            const endY =
              touch.clientY;


            const diffX =
              endX - startX;


            const diffY =
              endY - startY;


            const elapsed =
              Date.now() -
              startTime;



            /*
             * 横方向50px以上
             *
             * 横移動が縦移動より大きい
             *
             * 1秒以内
             */

            const horizontal =
              Math.abs(diffX) >= 50 &&
              Math.abs(diffX) >
                Math.abs(diffY);


            const quick =
              elapsed < 1000;



            if (
              horizontal &&
              quick
            ) {


              /*
               * 屋外
               *
               * 左スワイプ
               * ↓
               * 屋内
               */

              if (
                pageName === "outdoor" &&
                diffX < 0
              ) {

                showPage("indoor");

              }



              /*
               * 屋内
               *
               * 右スワイプ
               * ↓
               * 屋外
               */

              if (
                pageName === "indoor" &&
                diffX > 0
              ) {

                showPage("outdoor");

              }

            }



            startX = 0;
            startY = 0;
            startTime = 0;

          },
          {
            passive: true
          }
        );

      }

      catch (error) {

        console.error(
          "スワイプ設定エラー:",
          error
        );

      }

    }



    /* ================================
       iframe読み込み完了時
       ================================ */

    const outdoorPage =
      document.getElementById(
        "outdoorPage"
      );


    const indoorPage =
      document.getElementById(
        "indoorPage"
      );



    outdoorPage.addEventListener(
      "load",
      function() {

        setupSwipe(
          outdoorPage,
          "outdoor"
        );

      }
    );


    indoorPage.addEventListener(
      "load",
      function() {

        setupSwipe(
          indoorPage,
          "indoor"
        );

      }
    );



    /*
     * 念のため、
     * すでに読み込み済みの場合にも設定
     */

    if (
      outdoorPage.contentDocument &&
      outdoorPage.contentDocument.readyState !==
        "loading"
    ) {

      setupSwipe(
        outdoorPage,
        "outdoor"
      );

    }


    if (
      indoorPage.contentDocument &&
      indoorPage.contentDocument.readyState !==
        "loading"
    ) {

      setupSwipe(
        indoorPage,
        "indoor"
      );

    }


  </script>


</body>

</html>
