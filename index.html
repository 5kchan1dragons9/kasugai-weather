<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>春日井市 Weather Station</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f3f5f7;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;
    }

    /* タブ */

    .tabs {
      display: flex;
      width: 100%;
      height: 54px;
      background: white;
      border-bottom: 1px solid #ddd;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      position: relative;
      z-index: 10;
    }

    .tab {
      flex: 1;
      border: none;
      background: white;
      color: #777;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .tab.active {
      color: #222;
      background: #f3f5f7;
      box-shadow: inset 0 -3px 0 #222;
    }

    /* ページ表示 */

    .page {
      display: none;
      width: 100%;
      height: calc(100vh - 54px);
      border: none;
    }

    .page.active {
      display: block;
    }

  </style>

</head>


<body>

  <!-- タブ -->

  <div class="tabs">

    <button
      class="tab active"
      id="outdoorTab"
      onclick="showPage('outdoor')"
    >
      🌤️ 屋外
    </button>

    <button
      class="tab"
      id="indoorTab"
      onclick="showPage('indoor')"
    >
      🏠 屋内
    </button>

  </div>


  <!-- 屋外 -->

  <iframe
    id="outdoorPage"
    class="page active"
    src="outdoor.html"
  ></iframe>


  <!-- 屋内 -->

  <iframe
    id="indoorPage"
    class="page"
    src="indoor.html"
  ></iframe>


  <script>

    /*
     * 屋外・屋内の切り替え
     */

    function showPage(page) {

      const outdoorPage =
        document.getElementById(
          "outdoorPage"
        );

      const indoorPage =
        document.getElementById(
          "indoorPage"
        );

      const outdoorTab =
        document.getElementById(
          "outdoorTab"
        );

      const indoorTab =
        document.getElementById(
          "indoorTab"
        );


      if (page === "outdoor") {

        outdoorPage.classList.add(
          "active"
        );

        indoorPage.classList.remove(
          "active"
        );

        outdoorTab.classList.add(
          "active"
        );

        indoorTab.classList.remove(
          "active"
        );

      }


      if (page === "indoor") {

        indoorPage.classList.add(
          "active"
        );

        outdoorPage.classList.remove(
          "active"
        );

        indoorTab.classList.add(
          "active"
        );

        outdoorTab.classList.remove(
          "active"
        );

      }

    }


    /*
     * スワイプによる切り替え
     */

    let touchStartX = 0;
    let touchStartY = 0;

    const SWIPE_THRESHOLD = 60;


    document.addEventListener(
      "touchstart",
      function(event) {

        const touch =
          event.changedTouches[0];

        touchStartX =
          touch.screenX;

        touchStartY =
          touch.screenY;

      },
      {
        passive: true
      }
    );


    document.addEventListener(
      "touchend",
      function(event) {

        const touch =
          event.changedTouches[0];

        const touchEndX =
          touch.screenX;

        const touchEndY =
          touch.screenY;


        const diffX =
          touchEndX - touchStartX;

        const diffY =
          touchEndY - touchStartY;


        /*
         * 縦方向の操作が大きい場合は
         * スワイプとして扱わない
         */

        if (
          Math.abs(diffY) >
          Math.abs(diffX)
        ) {
          return;
        }


        /*
         * 短い操作は無視
         */

        if (
          Math.abs(diffX) <
          SWIPE_THRESHOLD
        ) {
          return;
        }


        /*
         * 現在表示しているページを確認
         */

        const outdoorPage =
          document.getElementById(
            "outdoorPage"
          );

        const isOutdoor =
          outdoorPage.classList.contains(
            "active"
          );


        /*
         * 左スワイプ
         * 屋外 → 屋内
         */

        if (diffX < 0 && isOutdoor) {

          showPage("indoor");

        }


        /*
         * 右スワイプ
         * 屋内 → 屋外
         */

        if (diffX > 0 && !isOutdoor) {

          showPage("outdoor");

        }

      },
      {
        passive: true
      }
    );

  </script>

</body>

</html>
