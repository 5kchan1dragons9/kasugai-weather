<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>春日井市の気象</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;

      background: #f5f6f7;
      color: #222;
      margin: 0;
      padding: 16px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    h1 {
      margin: 5px 0 20px;
      font-size: 28px;
    }

    .updated {
      color: #666;
      font-size: 13px;
      margin-bottom: 20px;
    }

    /* 現在値 */

    .current-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 12px;
    }

    .weather-card {
      background: white;
      border-radius: 14px;
      padding: 16px 10px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .weather-card .icon {
      font-size: 24px;
      margin-bottom: 6px;
    }

    .weather-card .value {
      font-size: 24px;
      font-weight: bold;
      line-height: 1.2;
    }

    .weather-card .unit {
      font-size: 13px;
      color: #666;
      margin-top: 4px;
    }

    /* 今日の最高・最低 */

    .daily-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 12px;
    }

    .daily-card {
      background: white;
      border-radius: 14px;
      padding: 14px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .daily-card .label {
      font-size: 14px;
      color: #666;
      margin-bottom: 5px;
    }

    .daily-card .value {
      font-size: 22px;
      font-weight: bold;
    }

    /* 24時間統計 */

    .history-extreme-card {
      background: white;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .history-extreme-title {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .history-extreme-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .extreme-item {
      text-align: center;
      padding: 10px;
      background: #f5f6f7;
      border-radius: 10px;
    }

    .extreme-item .label {
      font-size: 13px;
      color: #666;
      margin-bottom: 4px;
    }

    .extreme-item .value {
      font-size: 20px;
      font-weight: bold;
    }

    /* 24時間前との比較 */

    .comparison-card {
      background: white;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 30px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .comparison-title {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .comparison-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 7px 0;
      color: #555;
    }

    .comparison-row strong {
      color: #222;
      font-size: 18px;
    }

    /* グラフ */

    .chart-card {
      background: white;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .chart-card h2 {
      font-size: 18px;
      margin: 0 0 12px;
    }

    .chart-wrapper {
      position: relative;
      height: 280px;
    }

    /* スマホ */

    @media (max-width: 600px) {

      body {
        padding: 12px;
      }

      h1 {
        font-size: 24px;
      }

      .weather-card {
        padding: 14px 6px;
      }

      .weather-card .value {
        font-size: 21px;
      }

      .chart-wrapper {
        height: 240px;
      }
    }
  </style>
</head>


<body>

<div class="container">

  <h1>🌤️ 春日井市</h1>

  <div class="updated">
    最終更新：
    <span id="updated">--:--</span>
  </div>


  <!-- 現在値 -->

  <div class="current-grid">

    <div class="weather-card">

      <div class="icon">🌡️</div>

      <div class="value">
        <span id="temperature">--.-</span>
      </div>

      <div class="unit">
        気温 ℃
      </div>

    </div>


    <div class="weather-card">

      <div class="icon">💧</div>

      <div class="value">
        <span id="humidity">--</span>
      </div>

      <div class="unit">
        湿度 %
      </div>

    </div>


    <div class="weather-card">

      <div class="icon">🧭</div>

      <div class="value">
        <span id="pressure">----.-</span>
      </div>

      <div class="unit">
        気圧 hPa
      </div>

    </div>

  </div>


  <!-- 今日の最高・最低 -->

  <div class="daily-grid">

    <div class="daily-card">

      <div class="label">
        🔺 今日の最高
      </div>

      <div class="value">
        <span id="max_temp">--.-</span>℃
      </div>

    </div>


    <div class="daily-card">

      <div class="label">
        🔻 今日の最低
      </div>

      <div class="value">
        <span id="min_temp">--.-</span>℃
      </div>

    </div>

  </div>


  <!-- 過去24時間の最高・最低 -->

  <div class="history-extreme-card">

    <div class="history-extreme-title">
      📊 過去24時間
    </div>

    <div class="history-extreme-grid">

      <div class="extreme-item">

        <div class="label">
          🔺 気温最高
        </div>

        <div class="value">
          <span id="historyMax">--.-</span>℃
        </div>

      </div>


      <div class="extreme-item">

        <div class="label">
          🔻 気温最低
        </div>

        <div class="value">
          <span id="historyMin">--.-</span>℃
        </div>

      </div>

    </div>

  </div>


  <!-- 24時間前との比較 -->

  <div class="comparison-card">

    <div class="comparison-title">
      📊 24時間前との比較
    </div>

    <div class="comparison-row">

      <span>昨日同時刻の気温</span>

      <strong id="yesterdayTemperature">
        --.-℃
      </strong>

    </div>

    <div class="comparison-row">

      <span>気温差</span>

      <strong id="temperatureDifference">
        --.-℃
      </strong>

    </div>

    <div class="comparison-row">

      <span>湿度差</span>

      <strong id="humidityDifference">
        --%
      </strong>

    </div>

    <div class="comparison-row">

      <span>気圧差</span>

      <strong id="pressureDifference">
        --.-hPa
      </strong>

    </div>

  </div>


  <!-- 気温 -->

  <div class="chart-card">

    <h2>🌡️ 気温（24時間）</h2>

    <div class="chart-wrapper">

      <canvas id="temperatureChart"></canvas>

    </div>

  </div>


  <!-- 湿度 -->

  <div class="chart-card">

    <h2>💧 湿度（24時間）</h2>

    <div class="chart-wrapper">

      <canvas id="humidityChart"></canvas>

    </div>

  </div>


  <!-- 気圧 -->

  <div class="chart-card">

    <h2>🧭 気圧（24時間）</h2>

    <div class="chart-wrapper">

      <canvas id="pressureChart"></canvas>

    </div>

  </div>


</div>


<script>

  /*
   * ページを10分ごとに自動更新
   */

  setTimeout(() => {
    location.reload();
  }, 10 * 60 * 1000);


  /*
   * 現在のデータ
   */

  let currentData = null;

  fetch("data.json?cache=" + Date.now())

    .then(response => response.json())

    .then(data => {

      currentData = data;

      document.getElementById(
        "temperature"
      ).textContent = data.temperature;

      document.getElementById(
        "humidity"
      ).textContent = data.humidity;

      document.getElementById(
        "pressure"
      ).textContent = data.pressure;

      document.getElementById(
        "max_temp"
      ).textContent = data.max_temp;

      document.getElementById(
        "min_temp"
      ).textContent = data.min_temp;

      document.getElementById(
        "updated"
      ).textContent = data.updated;

    })

    .catch(error => {

      console.error(
        "データ取得エラー:",
        error
      );

    });


  /*
   * 履歴データ
   */

  fetch("history.json?cache=" + Date.now())

    .then(response => response.json())

    .then(history => {

      if (!history || history.length === 0) {
        return;
      }


      /*
       * 24時間前の時刻
       */

      const now =
        Date.now();

      const graphCutoff =
        now - 24 * 60 * 60 * 1000;


      /*
       * グラフ用データ
       */

      const graphHistory =
        history.filter(item => {

          const itemTime =
            new Date(
              item.time.replace(
                " ",
                "T"
              ) + ":00+09:00"
            );

          return (
            itemTime.getTime() >=
            graphCutoff
          );

        });


      const labels =
        graphHistory.map(item => {

          const parts =
            item.time.split(" ");

          return parts[1];

        });


      /*
       * 過去24時間の最高・最低
       */

      const temperatures =
        graphHistory
          .map(item =>
            parseFloat(item.temperature)
          )
          .filter(value =>
            !isNaN(value)
          );


      if (temperatures.length > 0) {

        const max =
          Math.max(...temperatures);

        const min =
          Math.min(...temperatures);

        document.getElementById(
          "historyMax"
        ).textContent =
          max.toFixed(1);

        document.getElementById(
          "historyMin"
        ).textContent =
          min.toFixed(1);

      }


      /*
       * 共通グラフ設定
       */

      const commonOptions = {

        responsive: true,

        maintainAspectRatio: false,

        interaction: {

          mode: "index",

          intersect: false

        },

        plugins: {

          legend: {

            display: false

          },

          tooltip: {

            callbacks: {

              title: function(items) {

                return items[0].label;

              }

            }

          }

        },

        scales: {

          x: {

            ticks: {

              maxTicksLimit: 8,

              autoSkip: true

            }

          }

        }

      };


      /*
       * 気温グラフ
       */

      new Chart(

        document.getElementById(
          "temperatureChart"
        ),

        {

          type: "line",

          data: {

            labels: labels,

            datasets: [

              {

                label: "気温 ℃",

                data: graphHistory.map(
                  item => item.temperature
                ),

                tension: 0.25,

                pointRadius: 1,

                pointHoverRadius: 5,

                fill: false

              }

            ]

          },

          options: {

            ...commonOptions,

            scales: {

              ...commonOptions.scales,

              y: {

                title: {

                  display: true,

                  text: "℃"

                }

              }

            }

          }

        }

      );


      /*
       * 湿度グラフ
       */

      new Chart(

        document.getElementById(
          "humidityChart"
        ),

        {

          type: "line",

          data: {

            labels: labels,

            datasets: [

              {

                label: "湿度 %",

                data: graphHistory.map(
                  item => item.humidity
                ),

                tension: 0.25,

                pointRadius: 1,

                pointHoverRadius: 5,

                fill: false

              }

            ]

          },

          options: {

            ...commonOptions,

            scales: {

              ...commonOptions.scales,

              y: {

                title: {

                  display: true,

                  text: "%"

                }

              }

            }

          }

        }

      );


      /*
       * 気圧グラフ
       */

      new Chart(

        document.getElementById(
          "pressureChart"
        ),

        {

          type: "line",

          data: {

            labels: labels,

            datasets: [

              {

                label: "気圧 hPa",

                data: graphHistory.map(
                  item => item.pressure
                ),

                tension: 0.25,

                pointRadius: 1,

                pointHoverRadius: 5,

                fill: false

              }

            ]

          },

          options: {

            ...commonOptions,

            scales: {

              ...commonOptions.scales,

              y: {

                title: {

                  display: true,

                  text: "hPa"

                }

              }

            }

          }

        }

      );


      /*
       * 24時間前との比較
       */

      const targetTime =
        now - 24 * 60 * 60 * 1000;


      let closest = null;

      let closestDifference =
        Infinity;


      history.forEach(item => {

        const itemTime =
          new Date(
            item.time.replace(
              " ",
              "T"
            ) + ":00+09:00"
          );


        const difference =
          Math.abs(
            itemTime.getTime() -
            targetTime
          );


        if (
          difference <
          closestDifference
        ) {

          closestDifference =
            difference;

          closest =
            item;

        }

      });


      if (
        closest &&
        currentData
      ) {

        const currentTemperature =
          parseFloat(
            currentData.temperature
          );

        const yesterdayTemperature =
          parseFloat(
            closest.temperature
          );

        const currentHumidity =
          parseFloat(
            currentData.humidity
          );

        const yesterdayHumidity =
          parseFloat(
            closest.humidity
          );

        const currentPressure =
          parseFloat(
            currentData.pressure
          );

        const yesterdayPressure =
          parseFloat(
            closest.pressure
          );


        /*
         * 気温差
         */

        if (
          !isNaN(currentTemperature) &&
          !isNaN(yesterdayTemperature)
        ) {

          const difference =
            currentTemperature -
            yesterdayTemperature;

          const sign =
            difference > 0
              ? "+"
              : "";

          document.getElementById(
            "yesterdayTemperature"
          ).textContent =
            yesterdayTemperature.toFixed(1) +
            "℃";

          document.getElementById(
            "temperatureDifference"
          ).textContent =
            sign +
            difference.toFixed(1) +
            "℃";

        }


        /*
         * 湿度差
         */

        if (
          !isNaN(currentHumidity) &&
          !isNaN(yesterdayHumidity)
        ) {

          const difference =
            currentHumidity -
            yesterdayHumidity;

          const sign =
            difference > 0
              ? "+"
              : "";

          document.getElementById(
            "humidityDifference"
          ).textContent =
            sign +
            difference.toFixed(0) +
            "%";

        }


        /*
         * 気圧差
         */

        if (
          !isNaN(currentPressure) &&
          !isNaN(yesterdayPressure)
        ) {

          const difference =
            currentPressure -
            yesterdayPressure;

          const sign =
            difference > 0
              ? "+"
              : "";

          document.getElementById(
            "pressureDifference"
          ).textContent =
            sign +
            difference.toFixed(1) +
            "hPa";

        }

      }

    })

    .catch(error => {

      console.error(
        "履歴データ取得エラー:",
        error
      );

    });

</script>

</body>
</html>
