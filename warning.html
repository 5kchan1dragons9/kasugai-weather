<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>春日井市 注警報</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background: #fff4f4;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;
    }

    .container {
      padding: 20px;
    }

    .title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 18px;
    }

    .status {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      text-align: center;
      color: #555;
      font-size: 16px;
    }

    .updated {
      margin-top: 16px;
      text-align: center;
      color: #888;
      font-size: 13px;
    }

  </style>

</head>


<body>

  <div class="container">

    <div class="title">
      ⚠️ 春日井市の注警報
    </div>

    <div class="status">
      現在の情報を取得しています。
    </div>

    <div class="updated">
      情報取得後に更新されます
    </div>

  </div>

</body>

</html>
