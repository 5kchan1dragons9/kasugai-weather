<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>春日井市 注警報</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff4f4;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;
    }


    .header {

      height: 58px;

      display: flex;
      align-items: center;

      padding: 0 16px;

      background: #fff4f4;

      border-bottom: 1px solid #eadede;

    }


    .title {

      font-size: 20px;
      font-weight: 700;

    }


    .source {

      margin-left: auto;

      font-size: 12px;

      color: #777;

    }


    .content {

      width: 100%;
      height: calc(100vh - 58px);

      background: white;

    }


    iframe {

      width: 100%;
      height: 100%;

      border: none;

      display: block;

    }

  </style>

</head>


<body>


  <div class="header">

    <div class="title">
      ⚠️ 春日井市の注警報
    </div>

    <div class="source">
      気象庁
    </div>

  </div>


  <div class="content">

    <iframe
      src="https://www.data.jma.go.jp/multi/warn/warn_detail.html?code=230010&lang=jp"
      title="気象庁 春日井市 注警報"
    ></iframe>

  </div>


</body>

</html>
