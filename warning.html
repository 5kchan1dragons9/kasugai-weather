<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>春日井市 注警報</title>


  <style>

    * {
      box-sizing: border-box;
    }


    html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: auto;

      background: #fff4f4;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;

    }


    /* ================================
       全体
       ================================ */

    .container {

      padding: 20px;

    }


    /* ================================
       ヘッダー
       ================================ */

    .header {

      position: relative;

      padding-right: 50px;

      margin-bottom: 18px;

    }


    /* ================================
       タイトル
       ================================ */

    .title {

      font-size: 22px;

      font-weight: 700;

    }


    /* ================================
       手動更新ボタン
       ================================ */

    .refresh-button {

      position: fixed;

      top: 10px;
      right: 10px;

      width: 34px;
      height: 34px;

      border: none;
      border-radius: 50%;

      background: rgba(255,255,255,0.75);

      color: #666;

      font-size: 20px;

      display: flex;
      align-items: center;
      justify-content: center;

      box-shadow:
        0 2px 6px rgba(0,0,0,0.12);

      cursor: pointer;

      z-index: 9999;

      -webkit-tap-highlight-color: transparent;

    }


    .refresh-button:active {

      transform: scale(0.92);

      background: rgba(255,255,255,0.95);

    }


    .refresh-button.loading {

      opacity: 0.55;

      pointer-events: none;

    }


    /* ================================
       状態カード
       ================================ */

    .status {

      background: white;

      border-radius: 12px;

      padding: 20px;

      box-shadow:
        0 2px 8px rgba(0,0,0,0.08);

      text-align: center;

      color: #555;

      font-size: 16px;

    }


    /* ================================
       発表なし
       ================================ */

    .status.none {

      background: #f0f8f0;

      color: #356b35;

      border: 1px solid #d4e8d4;

    }


    /* ================================
       警報・注意報一覧
       ================================ */

    .warning-list {

      display: flex;

      flex-direction: column;

      gap: 12px;

    }


    /* ================================
       警報カード
       ================================ */

    .warning-card {

      background: white;

      border-radius: 12px;

      padding: 18px 20px;

      box-shadow:
        0 2px 8px rgba(0,0,0,0.08);

      border-left: 6px solid #d9534f;

    }


    .warning-card.warning {

      background: #fff0f0;

      border-left-color: #d9534f;

    }


    /* ================================
       注意報カード
       ================================ */

    .warning-card.advisory {

      background: #fff9e8;

      border-left-color: #e0a800;

    }


    /* ================================
       警報名
       ================================ */

    .warning-name {

      font-size: 19px;

      font-weight: 700;

      color: #333;

    }


    /* ================================
       状態
       ================================ */

    .warning-status {

      margin-top: 6px;

      font-size: 13px;

      color: #777;

    }


    /* ================================
       最終更新
       ================================ */

    .updated {

      margin-top: 18px;

      text-align: center;

      color: #888;

      font-size: 13px;

    }


    /* ================================
       エラー
       ================================ */

    .error {

      background: #f5f5f5;

      color: #777;

    }


    /* ================================
       スマートフォン
       ================================ */

    @media (max-width: 600px) {

      .container {

        padding: 14px;

      }

      .title {

        font-size: 21px;

      }

    }


    /* ================================
       タブレット・PC
       ================================ */

    @media (min-width: 601px) {

      .container {

        padding: 24px;

      }

      .title {

        font-size: 24px;

      }

    }

  </style>

</head>


<body>


  <!-- ================================
       手動更新ボタン
       ================================ -->

  <button
    id="refreshButton"
    class="refresh-button"
    type="button"
    aria-label="更新"
    onclick="manualRefresh()"
  >

    ↻

  </button>


  <div class="container">


    <!-- ヘッダー -->

    <div class="header">


      <div class="title">

        ⚠️ 春日井市の注警報

      </div>


    </div>


    <!-- 表示エリア -->

    <div id="content">

      <div class="status">

        現在の情報を取得しています。

      </div>

    </div>


    <!-- 更新時刻 -->

    <div
      class="updated"
      id="updated"
    >

      情報取得中……

    </div>


  </div>



  <script>


    /* ================================
       注警報データ取得
       ================================ */

    async function loadWarningData() {


      const button =
        document.getElementById(
          "refreshButton"
        );


      try {


        /*
         * 更新ボタンを読み込み中表示
         */

        button.classList.add(
          "loading"
        );


        /*
         * GitHub Pagesのキャッシュを避ける
         */

        const url =
          "warning-data.json?t=" +
          Date.now();


        const response =
          await fetch(url);


        if (!response.ok) {

          throw new Error(
            "データ取得エラー"
          );

        }


        const data =
          await response.json();


        displayWarningData(data);


      }


      catch (error) {


        console.error(
          "注警報データ取得エラー:",
          error
        );


        document.getElementById(
          "content"
        ).innerHTML = `

          <div class="status error">

            注警報情報を取得できませんでした。

          </div>

        `;


        document.getElementById(
          "updated"
        ).textContent =
          "データ取得エラー";

      }


      finally {


        /*
         * ボタンを通常状態へ戻す
         */

        button.classList.remove(
          "loading"
        );

      }

    }



    /* ================================
       手動更新
       ================================ */

    function manualRefresh() {

      loadWarningData();

    }



    /* ================================
       表示
       ================================ */

    function displayWarningData(data) {


      const content =
        document.getElementById(
          "content"
        );


      const updated =
        document.getElementById(
          "updated"
        );


      /* --------------------------------
         警報・注意報なし
         -------------------------------- */

      if (
        !data.warnings ||
        data.warnings.length === 0
      ) {


        content.innerHTML = `

          <div class="status none">

            ✓ 現在、発表されている
            警報・注意報はありません。

          </div>

        `;

      }


      /* --------------------------------
         警報・注意報あり
         -------------------------------- */

      else {


        let html =
          '<div class="warning-list">';


        data.warnings.forEach(
          function(item)
          {


            const name =
              item.name || "";


            const status =
              item.status || "";


            /*
             * 「警報」を含む場合は警報扱い
             * それ以外は注意報扱い
             */

            let className =
              "warning-card advisory";


            if (
              name.includes("警報")
            ) {

              className =
                "warning-card warning";

            }


            html += `

              <div class="${className}">

                <div class="warning-name">

                  ${name}

                </div>

                <div class="warning-status">

                  ${status}

                </div>

              </div>

            `;

          }
        );


        html +=
          "</div>";


        content.innerHTML =
          html;

      }


      /* --------------------------------
         更新時刻
         -------------------------------- */

      if (data.updated) {


        try {


          const date =
            new Date(
              data.updated
            );


          const formatted =
            date.toLocaleString(
              "ja-JP",
              {
                year: "numeric",
                month: "2-digit",
                day: "2-digit",
                hour: "2-digit",
                minute: "2-digit"
              }
            );


          updated.textContent =
            "最終更新：" +
            formatted;


        }


        catch (error) {

          updated.textContent =
            "最終更新：" +
            data.updated;

        }

      }


    }



    /* ================================
       初回読み込み
       ================================ */

    loadWarningData();



    /* ================================
       1分ごとに自動更新
       ================================ */

    setInterval(
      loadWarningData,
      60 * 1000
    );


  </script>


</body>

</html>
