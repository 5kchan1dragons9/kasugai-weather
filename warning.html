<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>春日井市 注警報</title>


  <style>

    * {
      box-sizing: border-box;
    }


    html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: auto;

      background: #fff4f4;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;

    }


    /* ================================
       全体
       ================================ */

    .container {

      padding: 20px;

    }


    /* ================================
       タイトル部分
       ================================ */

    .title-row {

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 12px;

      margin-bottom: 18px;

    }


    /* ================================
       タイトル
       ================================ */

    .title {

      font-size: 22px;

      font-weight: 700;

      margin: 0;

    }


    /* ================================
       更新ボタン
       ================================ */

    .refresh-button {

      flex-shrink: 0;

      width: 38px;
      height: 38px;

      border: none;

      border-radius: 50%;

      background: white;

      color: #555;

      font-size: 20px;

      display: flex;

      align-items: center;

      justify-content: center;

      cursor: pointer;

      box-shadow:
        0 2px 8px rgba(0,0,0,0.10);

      -webkit-tap-highlight-color:
        transparent;

      transition:
        transform 0.15s ease,
        opacity 0.15s ease;

    }


    .refresh-button:active {

      transform: scale(0.90);

    }


    .refresh-button:disabled {

      opacity: 0.45;

      cursor: default;

    }


    /* ================================
       更新中アニメーション
       ================================ */

    .refresh-button.loading {

      animation:
        refresh-spin 0.8s linear infinite;

    }


    @keyframes refresh-spin {

      from {

        transform: rotate(0deg);

      }

      to {

        transform: rotate(360deg);

      }

    }


    /* ================================
       状態カード
       ================================ */

    .status {

      background: white;

      border-radius: 12px;

      padding: 20px;

      box-shadow:
        0 2px 8px rgba(0,0,0,0.08);

      text-align: center;

      color: #555;

      font-size: 16px;

    }


    /* ================================
       発表なし
       ================================ */

    .status.none {

      background: #f0f8f0;

      color: #356b35;

      border: 1px solid #d4e8d4;

    }


    /* ================================
       警報・注意報一覧
       ================================ */

    .warning-list {

      display: flex;

      flex-direction: column;

      gap: 12px;

    }


    /* ================================
       警報カード
       ================================ */

    .warning-card {

      background: white;

      border-radius: 12px;

      padding: 18px 20px;

      box-shadow:
        0 2px 8px rgba(0,0,0,0.08);

      border-left: 6px solid #d9534f;

    }


    .warning-card.warning {

      background: #fff0f0;

      border-left-color: #d9534f;

    }


    /* ================================
       注意報カード
       ================================ */

    .warning-card.advisory {

      background: #fff9e8;

      border-left-color: #e0a800;

    }


    /* ================================
       警報名
       ================================ */

    .warning-name {

      font-size: 19px;

      font-weight: 700;

      color: #333;

    }


    /* ================================
       状態
       ================================ */

    .warning-status {

      margin-top: 6px;

      font-size: 13px;

      color: #777;

    }


    /* ================================
       最終更新
       ================================ */

    .updated {

      margin-top: 18px;

      text-align: center;

      color: #888;

      font-size: 13px;

    }


    /* ================================
       エラー
       ================================ */

    .error {

      background: #f5f5f5;

      color: #777;

    }


    /* ================================
       スマートフォン
       ================================ */

    @media (max-width: 600px) {

      .container {

        padding: 14px;

      }


      .title {

        font-size: 21px;

      }


      .refresh-button {

        width: 36px;
        height: 36px;

        font-size: 19px;

      }

    }


    /* ================================
       タブレット・PC
       ================================ */

    @media (min-width: 601px) {

      .container {

        max-width: 900px;

        margin: 0 auto;

        padding: 24px;

      }


      .title {

        font-size: 24px;

      }


      .refresh-button {

        width: 40px;
        height: 40px;

        font-size: 21px;

      }

    }

  </style>

</head>


<body>


  <div class="container">


    <!-- =================================
         タイトル ＋ 更新ボタン
         ================================= -->

    <div class="title-row">

      <div class="title">

        ⚠️ 春日井市の注警報

      </div>


      <button
        id="refreshButton"
        class="refresh-button"
        type="button"
        aria-label="注警報を更新"
        title="更新"
      >

        🔄

      </button>

    </div>


    <!-- =================================
         表示エリア
         ================================= -->

    <div id="content">

      <div class="status">

        現在の情報を取得しています。

      </div>

    </div>


    <!-- =================================
         更新時刻
         ================================= -->

    <div
      class="updated"
      id="updated"
    >

      情報取得中……

    </div>


  </div>



  <script>


    /* ================================
       更新ボタン
       ================================ */

    const refreshButton =
      document.getElementById(
        "refreshButton"
      );


    /* ================================
       注警報データ取得
       ================================ */

    async function loadWarningData() {


      /*
       * 更新中表示
       */

      refreshButton.disabled = true;

      refreshButton.classList.add(
        "loading"
      );


      try {


        /*
         * GitHub Pagesのキャッシュを避ける
         * 現在時刻をURLに付加
         */

        const url =
          "warning-data.json?t=" +
          Date.now();


        const response =
          await fetch(url);


        if (!response.ok) {

          throw new Error(
            "データ取得エラー"
          );

        }


        const data =
          await response.json();


        displayWarningData(data);


      }


      catch (error) {


        console.error(
          "注警報データ取得エラー:",
          error
        );


        document.getElementById(
          "content"
        ).innerHTML = `

          <div class="status error">

            注警報情報を取得できませんでした。

          </div>

        `;


        document.getElementById(
          "updated"
        ).textContent =
          "データ取得エラー";


      }


      finally {


        /*
         * 更新完了
         */

        refreshButton.disabled = false;

        refreshButton.classList.remove(
          "loading"
        );

      }

    }



    /* ================================
       表示
       ================================ */

    function displayWarningData(data) {


      const content =
        document.getElementById(
          "content"
        );


      const updated =
        document.getElementById(
          "updated"
        );


      /* ================================
         警報・注意報なし
         ================================ */

      if (
        !data.warnings ||
        data.warnings.length === 0
      ) {


        content.innerHTML = `

          <div class="status none">

            ✓ 現在、発表されている
            警報・注意報はありません。

          </div>

        `;

      }


      /* ================================
         警報・注意報あり
         ================================ */

      else {


        let html =
          '<div class="warning-list">';


        data.warnings.forEach(
          function(item)
          {


            const name =
              item.name || "";


            const status =
              item.status || "";


            /*
             * 「警報」を含む場合は警報扱い
             * それ以外は注意報扱い
             */

            let className =
              "warning-card advisory";


            if (
              name.includes("警報")
            ) {

              className =
                "warning-card warning";

            }


            html += `

              <div class="${className}">

                <div class="warning-name">

                  ${name}

                </div>


                <div class="warning-status">

                  ${status}

                </div>

              </div>

            `;

          }
        );


        html +=
          "</div>";


        content.innerHTML =
          html;

      }


      /* ================================
         更新時刻
         ================================ */

      if (data.updated) {


        try {


          const date =
            new Date(
              data.updated
            );


          const formatted =
            date.toLocaleString(
              "ja-JP",
              {
                year: "numeric",
                month: "2-digit",
                day: "2-digit",
                hour: "2-digit",
                minute: "2-digit"
              }
            );


          updated.textContent =
            "最終更新：" +
            formatted;


        }


        catch (error) {

          updated.textContent =
            "最終更新：" +
            data.updated;

        }

      }

    }



    /* ================================
       手動更新ボタン
       ================================ */

    refreshButton.addEventListener(
      "click",
      function() {

        loadWarningData();

      }
    );



    /* ================================
       初回読み込み
       ================================ */

    loadWarningData();



    /* ================================
       1分ごとに自動更新
       ================================ */

    setInterval(
      loadWarningData,
      60 * 1000
    );


  </script>


</body>

</html>
