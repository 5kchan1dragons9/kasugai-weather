name: Update weather warning data

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-warning:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Get JMA warning data
        run: |
          curl -L \
            "https://www.data.jma.go.jp/developer/xml/feed/regular.xml" \
            -o jma-feed.xml


      - name: Create warning data
        run: |

          python - <<'PY'

          import json
          import urllib.request
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone, timedelta


          CITY_NAME = "春日井市"
          CITY_CODE = "2320600"

          JST = timezone(timedelta(hours=9))


          result = {
              "updated": datetime.now(JST).isoformat(),
              "city": CITY_NAME,
              "cityCode": CITY_CODE,
              "status": "none",
              "message": "",
              "warnings": []
          }


          # --------------------------------
          # 気象庁フィード
          # --------------------------------

          feed = ET.parse("jma-feed.xml")

          root = feed.getroot()

          NS = {
              "atom": "http://www.w3.org/2005/Atom"
          }


          # --------------------------------
          # VPWS50だけを探す
          # --------------------------------

          vpws_urls = []


          for entry in root.findall(
              "atom:entry",
              NS
          ):

              title = entry.find(
                  "atom:title",
                  NS
              )

              if title is None:
                  continue


              title_text = title.text or ""


              if (
                  "気象警報・注意報（Ｒ０６）"
                  in title_text
                  and
                  "集約通報"
                  in title_text
              ):

                  for link in entry.findall(
                      "atom:link",
                      NS
                  ):

                      href = link.attrib.get("href")

                      if href:
                          vpws_urls.append(href)


          vpws_urls = list(
              dict.fromkeys(vpws_urls)
          )


          # --------------------------------
          # 最新のVPWS50だけ取得
          # --------------------------------

          if vpws_urls:

              url = vpws_urls[0]

              print("VPWS50:", url)


              with urllib.request.urlopen(
                  url,
                  timeout=15
              ) as response:

                  xml_data = response.read()


              warning_root = ET.fromstring(
                  xml_data
              )


              # --------------------------------
              # 春日井市を探す
              # --------------------------------

              for area in warning_root.iter():

                  if not area.tag.endswith("Area"):
                      continue


                  area_name = ""
                  area_code = ""


                  for child in area:

                      if child.tag.endswith("Name"):
                          area_name = (
                              child.text or ""
                          ).strip()


                      if child.tag.endswith("Code"):
                          area_code = (
                              child.text or ""
                          ).strip()


                  if not (
                      area_name == CITY_NAME
                      or area_code == CITY_CODE
                  ):
                      continue


                  # --------------------------------
                  # Kindを取得
                  # --------------------------------

                  for kind in area.iter():

                      if not kind.tag.endswith("Kind"):
                          continue


                      name = ""
                      status = ""


                      for child in kind:

                          if child.tag.endswith("Name"):
                              name = (
                                  child.text or ""
                              ).strip()


                          if child.tag.endswith("Status"):
                              status = (
                                  child.text or ""
                              ).strip()


                      if not name:
                          continue


                      if (
                          "発表" in status
                          or
                          "継続" in status
                      ):

                          if not any(
                              w["name"] == name
                              for w in result["warnings"]
                          ):

                              result["warnings"].append(
                                  {
                                      "name": name,
                                      "status": status
                                  }
                              )


          # --------------------------------
          # 結果
          # --------------------------------

          if result["warnings"]:

              result["status"] = "active"

              result["message"] = (
                  "現在、春日井市に"
                  "発表されている警報・注意報があります。"
              )

          else:

              result["status"] = "none"

              result["message"] = (
                  "現在、春日井市に"
                  "発表されている警報・注意報はありません。"
              )


          # --------------------------------
          # 保存
          # --------------------------------

          with open(
              "warning-data.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  result,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          PY


      - name: Commit warning data
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add warning-data.json


          git diff --cached --quiet || \
            git commit -m "Update warning data"


          git push
