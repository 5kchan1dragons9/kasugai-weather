name: Update weather warning data

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-warning:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get JMA warning data
        run: |
          curl -L \
            "https://www.data.jma.go.jp/developer/xml/feed/regular.xml" \
            -o jma-feed.xml

      - name: Create warning data
        run: |
          python - <<'PY'
          import json
          import xml.etree.ElementTree as ET

          result = {
              "updated": "",
              "message": "現在の情報を取得しています。",
              "warnings": []
          }

          try:
              tree = ET.parse("jma-feed.xml")
              root = tree.getroot()

              ns = {
                  "atom": "http://www.w3.org/2005/Atom"
              }

              entries = root.findall("atom:entry", ns)

              for entry in entries:
                  title = entry.find("atom:title", ns)

                  if title is not None:
                      text = title.text or ""

                      if "気象警報・注意報" in text:
                          result["warnings"].append(text)

              if result["warnings"]:
                  result["message"] = "気象庁から注警報情報を取得しました。"
              else:
                  result["message"] = "現在、発表されている警報・注意報はありません。"

          except Exception as e:
              result["message"] = "情報を取得できませんでした。"

          with open("warning-data.json", "w", encoding="utf-8") as f:
              json.dump(
                  result,
                  f,
                  ensure_ascii=False,
                  indent=2
              )
          PY

      - name: Commit warning data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add warning-data.json

          git diff --cached --quiet || \
            git commit -m "Update warning data"

          git push
